<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤트라스 후원물품 현황</title>
<meta name="description" content="쑥쑥컴퍼니(헤트라스) 디퓨저 후원물품의 실시간 신청·잔여 수량">
<meta property="og:title" content="헤트라스 후원물품 현황">
<meta property="og:description" content="품목별 신청·잔여 수량을 실시간으로 확인하고 바로 신청하세요">
<meta property="og:image" content="https://wvksunny-pixel.github.io/hetras/assets/donation-items/6_holiday2025-hotelwood_insta-1.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f6f5f2; --surface:#fff; --fg:#1f2421; --mute:#6b716d; --line:#e2e0da;
  --accent:#2f5d50; --accent-soft:#e4eee9; --applied:#c9a46a; --warn:#a8691b; --no:#b23b3b;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141816; --surface:#1c211f; --fg:#e6ebe8; --mute:#9aa39e; --line:#2e3532;
  --accent:#8cc4b0; --accent-soft:#233430; --applied:#b89558; --warn:#e0a35a; --no:#ef7b7b; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 110px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
h1{font-size:26px;margin:0;text-wrap:balance}
.lead{color:var(--mute);margin:4px 0 0;font-size:14px;max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--surface);text-decoration:none;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:8px 14px;font-size:13px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute);letter-spacing:.04em}
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
.live.stale .dot{background:var(--warn);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.item.out{opacity:.6}
.item img,.item .noimg{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg);display:block}
.item .noimg{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.item h2{font-size:16px;margin:0;line-height:1.4;text-wrap:balance}
.desc,.meta{font-size:12.5px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--applied);transition:width .6s}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-variant-numeric:tabular-nums}
.nums div{font-size:11.5px;color:var(--mute)}
.nums b{display:block;font-size:17px;color:var(--fg)}
.nums .left b{color:var(--accent)}
.nums .left.low b{color:var(--warn)}
.tag{align-self:flex-start;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.tag.soldout{color:var(--no)}.tag.closed{color:var(--mute)}.tag.low{color:var(--warn)}
.body .btn{margin-top:auto}
.msg{background:color-mix(in srgb,var(--no) 10%,var(--surface));color:var(--no);border-radius:10px;padding:12px 14px;font-size:14px}
.skeleton{background:var(--surface);border:1px solid var(--line);border-radius:14px;height:420px;opacity:.6}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.foot .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.foot p{margin:0;font-size:13px;color:var(--mute)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>헤트라스 후원물품 현황</h1>
      <p class="lead">쑥쑥컴퍼니(헤트라스)에서 후원한 디퓨저 물품입니다. 신청이 들어오면 아래 수량이 바로 바뀝니다.</p>
    </div>
    <div class="live" id="live"><span class="dot"></span><span id="liveText">수량 불러오는 중…</span><button class="btn ghost" id="refresh" type="button">새로고침</button></div>
  </header>

  <section class="stats" id="stats" aria-label="전체 합계"></section>
  <div id="msg"></div>
  <section class="items" id="items" aria-label="품목 목록">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </section>
</div>

<div class="foot"><div class="in">
  <p>필요한 품목이 있으면 신청서에서 수량과 받을 곳을 입력해 주세요.</p>
  <a class="btn" id="applyMain" target="_blank" rel="noopener">신청하기 →</a>
</div></div>

<script>
var APP = 'https://script.google.com/macros/s/AKfycbyG1zwqlUDHKcc8PhlkIbAmD-UFx5rS9B1yV8Q-mwxbFc8rf9WLIdgCiofknAXUYuQczw/exec';
var REFRESH_MS = 30000;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n) { return Number(n || 0).toLocaleString('ko-KR'); }
$('applyMain').href = APP;

var lastOk = 0, loading = false;
function render(data) {
  var items = data.items || [];
  var t = items.reduce(function (a, it) { a.r += it.received; a.a += it.applied; a.l += it.left; return a; }, { r: 0, a: 0, l: 0 });
  $('stats').innerHTML =
    '<div class="stat"><b>' + items.length + '</b><span>품목</span></div>' +
    '<div class="stat"><b>' + fmt(t.r) + '</b><span>후원 수량</span></div>' +
    '<div class="stat"><b>' + fmt(t.a) + '</b><span>신청된 수량</span></div>' +
    '<div class="stat"><b>' + fmt(t.l) + '</b><span>신청 가능 수량</span></div>';
  $('items').innerHTML = items.map(function (it) {
    var pct = it.received ? Math.min(100, it.applied / it.received * 100) : 0;
    var soldout = it.left <= 0, closed = !it.open, low = !soldout && it.received && it.left / it.received < 0.1;
    var tag = soldout ? '<span class="tag soldout">신청 마감</span>' : closed ? '<span class="tag closed">신청 중지</span>' : low ? '<span class="tag low">마감 임박</span>' : '';
    var img = it.image ? '<img src="' + esc(it.image) + '" alt="' + esc(it.name) + '" loading="lazy" onerror="this.outerHTML=\'<div class=noimg>사진 준비 중</div>\'">' : '<div class="noimg">사진 준비 중</div>';
    return '<article class="item' + (soldout || closed ? ' out' : '') + '">' + img + '<div class="body">' + tag +
      '<h2>' + esc(it.name) + '</h2>' +
      (it.desc ? '<div class="desc">' + esc(it.desc) + '</div>' : '') +
      '<div class="meta">유통기한 ' + esc(it.expiry || '-') + '</div>' +
      '<div class="bar" role="img" aria-label="신청 ' + Math.round(pct) + '%"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="nums"><div>후원<b>' + fmt(it.received) + '</b></div><div>신청<b>' + fmt(it.applied) + '</b></div>' +
      '<div class="left' + (low ? ' low' : '') + '">잔여<b>' + fmt(it.left) + '</b></div></div>' +
      '<a class="btn" href="' + APP + '" target="_blank" rel="noopener"' + (soldout || closed ? ' aria-disabled="true" tabindex="-1"' : '') + '>' +
      (soldout ? '신청 마감' : closed ? '신청 중지' : '이 품목 신청하기') + '</a>' +
      '</div></article>';
  }).join('');
}
function setLive() {
  var el = $('live');
  if (!lastOk) return;
  var sec = Math.round((Date.now() - lastOk) / 1000);
  el.classList.toggle('stale', sec > REFRESH_MS / 1000 * 3);
  $('liveText').textContent = '실시간 · ' + (sec < 5 ? '방금' : sec < 60 ? sec + '초 전' : Math.floor(sec / 60) + '분 전') + ' 업데이트';
}
function load() {
  if (loading) return; loading = true;
  fetch(APP + '?format=json&t=' + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { render(d); lastOk = Date.now(); $('msg').innerHTML = ''; setLive(); })
    .catch(function () {
      $('msg').innerHTML = '<div class="msg">' + (lastOk ? '최신 수량을 가져오지 못했어요. 표시된 수량은 마지막으로 불러온 값입니다.' : '수량을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.') + '</div>';
      if (!lastOk) $('items').innerHTML = '';
    })
    .then(function () { loading = false; });
}
$('refresh').addEventListener('click', load);
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
setInterval(setLive, 5000);
load();
</script>
</body>
</html>
